name: Deploy website

on:
  push:
    branches: [main]
    paths: ['index.html', 'img/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['index.html', 'img/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview FTP changes without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish pref.tools landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate static page and local assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.').resolve()
          html = (root / 'index.html').read_text()

          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in ('src', 'srcset') or not value:
                          continue
                      for ref in (part.strip().split()[0] for part in value.split(',')):
                          url = urlsplit(ref)
                          if url.scheme or url.netloc or not url.path:
                              continue
                          asset = (root / url.path).resolve()
                          assert asset.is_relative_to(root) and asset.is_file(), f'Missing asset: {ref}'

          Assets().feed(html)
          print('Static page and referenced images verified')
          PY

      # FTP credentials are rooted at pref.tools/. Only index.html and img/ are
      # published; the other tools living in subfolders are never touched.
      # curl is used instead of an FTP action because the host resets the
      # connection when such actions create directories. Images go first, so
      # the page never references a missing file. Nothing is deleted.
      - name: Upload website via FTPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          for file in img/* index.html; do
            if [ "$DRY_RUN" = true ]; then
              echo "would upload $file"
              continue
            fi
            echo "uploading $file"
            curl --fail --silent --show-error --ssl-reqd --retry 3 --max-time 120 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-create-dirs \
              -T "$file" "ftp://w008ef9a.kasserver.com/$file"
          done

      - name: Verify published files over HTTPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.dry_run != true
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://pref.tools/?revision=${GITHUB_SHA}" --output "$RUNNER_TEMP/site-check"
          cmp index.html "$RUNNER_TEMP/site-check"
          for file in img/*; do
            curl --fail --silent --show-error --location --retry 3 --max-time 60 \
              "https://pref.tools/$file?revision=${GITHUB_SHA}" --output "$RUNNER_TEMP/site-check"
            cmp "$file" "$RUNNER_TEMP/site-check"
          done
          echo "Published page and image bytes match this commit."
